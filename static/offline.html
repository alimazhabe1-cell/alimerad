<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آفلاین</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f0c29;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        h1 { color: #ffd700; font-size: 28px; }
        p { opacity: 0.8; font-size: 18px; }
        .icon { font-size: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>شما آفلاین هستید</h1>
        <p>لطفاً اتصال اینترنت را برقرار کنید تا اطلاعات به‌روز شوند.</p>
        <p style="font-size:14px; opacity:0.5;">اطلاعات قبلی در حافظه کش موجود است.</p>
    </div>
</body>
</html>
