<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}اطلاعات روز{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f0c29;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        .auth-container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .auth-container h2 {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            opacity: 0.8;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.1);
        }
        .form-control option {
            background: #1a1a2e;
            color: #fff;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,215,0,0.3);
        }
        .btn-danger {
            background: #dc3545;
            color: #fff;
            margin-top: 10px;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .auth-container p {
            text-align: center;
            margin-top: 18px;
            opacity: 0.7;
        }
        .auth-container a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-container a:hover {
            text-decoration: underline;
        }
        .flash {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .flash.success {
            background: #28a745;
            color: #fff;
        }
        .flash.danger {
            background: #dc3545;
            color: #fff;
        }
        .flash.info {
            background: #17a2b8;
            color: #fff;
        }
        .text-center {
            text-align: center;
        }
        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
