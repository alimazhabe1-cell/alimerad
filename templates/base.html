<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}اطلاعات روز{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #0f0c29; color: #fff; padding: 20px; }
        .auth-container { max-width: 400px; margin: 50px auto; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 16px; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border-radius: 8px; border: none; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-primary { background: #ffd700; color: #1a1a2e; }
        .btn-danger { background: #dc3545; color: #fff; }
        .flash { padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .flash.success { background: #28a745; }
        .flash.danger { background: #dc3545; }
        .flash.info { background: #17a2b8; }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
